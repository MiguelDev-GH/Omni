name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: go test
        run: go test -race ./...

  subjects:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: loja
          POSTGRES_PASSWORD: loja-cobaia
          POSTGRES_DB: loja
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U loja"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      LOJA_TESTE_BANCO: postgres://loja:loja-cobaia@127.0.0.1:5433/loja?sslmode=disable
    defaults:
      run:
        working-directory: subjects/loja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: subjects/loja/go.mod
          cache-dependency-path: subjects/loja/go.sum
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: subjects/loja
      - name: go test
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: make build
        working-directory: .
        run: make build
